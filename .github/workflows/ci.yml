name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 编译产物必须是 Java 17 字节码：pom 里漏写 java.version 会静默退回 1.8
      - name: Verify bytecode target is Java 17
        run: |
          mvn -B -q -DskipTests compile
          MAJOR=$(javap -v -cp sky-server/target/classes com.sky.SkyApplication | awk '/major version/{print $3}')
          echo "class file major version = $MAJOR"
          test "$MAJOR" = "61"

      - name: Run unit tests
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sky-server-jar
          path: sky-server/target/sky-server-1.0-SNAPSHOT.jar

  docker-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sky-take-out:ci .
