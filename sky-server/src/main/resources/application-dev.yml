sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: root
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:your-access-key-secret}
    bucket-name: ${ALIOSS_BUCKET_NAME:your-bucket-name}
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:123456}
    database: 10
  # 敏感配置一律走环境变量，禁止明文入库。
  # 本地调试：export WECHAT_SECRET=xxx WECHAT_API_V3_KEY=xxx ...
  wechat:
    appid: ${WECHAT_APPID:your-appid}
    secret: ${WECHAT_SECRET:your-secret}
    mchid: ${WECHAT_MCHID:your-mchid}
    mchSerialNo: ${WECHAT_MCH_SERIAL_NO:your-mch-serial-no}
    privateKeyFilePath: ${WECHAT_PRIVATE_KEY_PATH:}
    apiV3Key: ${WECHAT_API_V3_KEY:your-api-v3-key}
    weChatPayCertFilePath: ${WECHAT_PAY_CERT_PATH:}
    notifyUrl: ${WECHAT_NOTIFY_URL:https://your-domain/notify/paySuccess}
    refundNotifyUrl: ${WECHAT_REFUND_NOTIFY_URL:https://your-domain/notify/refundSuccess}
  messaging:
    # 本地默认关闭；启动 Kafka、RabbitMQ 后改为 true。
    kafka:
      enabled: false
    rabbitmq:
      enabled: false

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
