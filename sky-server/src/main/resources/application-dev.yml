sky:
  jwt:
    # 仅本地开发使用的固定密钥，长度满足 HS256 要求；生产必须由环境变量覆盖，
    # application.yml 里不给默认值，环境变量缺失时启动直接失败。
    admin-secret-key: ${JWT_ADMIN_SECRET_KEY:local-dev-only-admin-secret-key-please-rotate}
    user-secret-key: ${JWT_USER_SECRET_KEY:local-dev-only-user-secret-key-please-rotate}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:123456}
    database: 10
  # 微信/OSS 配置统一在 application.yml 里按环境变量解析，本地要覆盖就设对应环境变量
  messaging:
    # 本地默认关闭；启动 Kafka、RabbitMQ 后改为 true。
    kafka:
      enabled: false
    rabbitmq:
      enabled: false

logging:
  level:
    # SQL 日志只在本地开：线上会把手机号、收货地址、订单金额完整写进制品日志
    com.sky.mapper: debug

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 等所有 ISR 确认，配合发送端的 future.get() 才算"消息必达"
      acks: all
      retries: 3
      # 幂等生产者：重试不会产生重复消息
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 本地消息表要"拿到确认才算发送成功"，必须开 correlated confirm
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ack：坏消息进死信而不是无限 requeue
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 8
