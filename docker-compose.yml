# 本地/演示编排。
# 默认值都是"只在本机能跑"的弱口令，任何对外环境都必须用 .env 覆盖 ——
# 应用侧的 JWT_SECRET / DB_PASSWORD / REDIS_PASSWORD 没有默认值，缺失时启动会直接失败。
services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sky_local_dev_password}
      MYSQL_DATABASE: sky_take_out
      TZ: Asia/Shanghai
    ports:
      # 只绑到回环地址：不要把 3306 暴露到局域网，本机客户端照常用
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: sky-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sky_local_dev_password}
    environment:
      # 供 healthcheck 里的 redis-cli 使用
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sky_local_dev_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  kafka:
    image: bitnami/kafka:3.7
    container_name: sky-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 关掉自动建 topic：order.created 由应用启动时显式声明分区与副本数
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sky-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sky-server
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sky_local_dev_password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-sky_local_dev_password}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # JWT 签名密钥必须 >=32 字节；这里给的是本地占位，线上必须换成自己的随机值
      JWT_ADMIN_SECRET_KEY: ${JWT_ADMIN_SECRET_KEY:?set JWT_ADMIN_SECRET_KEY in .env}
      JWT_USER_SECRET_KEY: ${JWT_USER_SECRET_KEY:?set JWT_USER_SECRET_KEY in .env}
      # 集群部署时每个实例必须是不同的值
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID:-1}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
