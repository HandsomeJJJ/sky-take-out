sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: root
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: your-bucket-name
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 10
  wechat:
    appid: ***REMOVED***
    secret: ***REMOVED***
    mchid : ***REMOVED***
    mchSerialNo: ***REMOVED***
    privateKeyFilePath: D:\pay\apiclient_key.pem
    apiV3Key: ***REMOVED***
    weChatPayCertFilePath: D:\pay\wechatpay_166D96F876F45C7D07CE98952A96EC980368ACFC.pem
    notifyUrl: https://***REMOVED***/notify/paySuccess
    refundNotifyUrl: https://***REMOVED***/notify/refundSuccess
  messaging:
    # 本地默认关闭；启动 Kafka、RabbitMQ 后改为 true。
    kafka:
      enabled: false
    rabbitmq:
      enabled: false

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
