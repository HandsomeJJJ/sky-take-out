version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    # 暂时只保留 main，暂停自动版本 PR；恢复时把 0 改回 10 即可。
    open-pull-requests-limit: 0
    ignore:
      # 以下三个包的下一个主版本都需要 Jakarta / Spring Boot 4 迁移，
      # 先锁在当前的 javax / Boot 2.7 线上，避免每周重复生成不兼容 PR。
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.pagehelper:pagehelper-spring-boot-starter"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.glassfish.jaxb:jaxb-runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mybatis.spring.boot:mybatis-spring-boot-starter"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.xiaoymin:knife4j-spring-boot-starter"
        update-types: ["version-update:semver-major"]
      # Redisson 3.18+ 已切到 Spring Boot 3 / Spring Data 3，2.7 线只能停在 3.17.7。
      - dependency-name: "org.redisson:redisson-spring-boot-starter"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
